<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>核心计算链回归测试</title>
<style>
  body { font-family: 'PingFang SC', 'Roboto', sans-serif; background: #F4F3EE; margin: 0; padding: 20px; color: #1A1B1C; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #6B7280; margin-bottom: 16px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  button { padding: 8px 16px; border: none; border-radius: 8px; background: #2C7DA0; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { opacity: .88; }
  #summary { font-size: 13px; font-weight: 600; }
  .pass { color: #1E7E34; }
  .fail { color: #C0392B; }
  #out { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 12px 16px; font-size: 12.5px; line-height: 1.7; }
  .t-pass { color: #1E7E34; }
  .t-fail { color: #C0392B; font-weight: 600; }
  .t-info { color: #6B7280; }
</style>
</head>
<body>
<h1>核心计算链回归测试</h1>
<div class="sub">浏览器端一键回归 · 覆盖 isClosedTrade / 凯利 / 滑点 / 权益曲线 / 存储安全 · 页面加载即自动运行</div>
<div class="bar">
  <button onclick="runAll()">重新运行</button>
  <span id="summary">—</span>
</div>
<div id="out">加载中…</div>

<script src="../js/chart-guard.js?v=5.6.9"></script>
<script src="../js/constants.js?v=5.6.9"></script>
<script src="../js/utils.js?v=5.6.9"></script>
<script src="../js/storage.js?v=5.6.9"></script>
<script src="../js/slippage.js?v=5.6.9"></script>
<script src="../js/skills-integration.js?v=5.6.9"></script>
<script src="../js/calculator.js?v=5.6.9"></script>
<script src="../js/risk.js?v=5.6.9"></script>
<script src="../js/planner.js?v=5.6.9"></script>
<script src="../js/discipline-led.js?v=5.6.9"></script>
<script src="../js/settings.js?v=5.6.9"></script>
<script src="../js/io.js?v=5.6.9"></script>
<script src="../js/logs.js?v=5.6.9"></script>
<script src="../js/modals.js?v=5.6.9"></script>
<script>
(function() {
  // ---- 环境 mock（与生产隔离） ----
  window.showToast = function() {};
  window.renderLogs = function() {};
  window.renderDashboard = function() {};
  window._activeFilters = null;
  var store = {};
  // 自洽内存存储：getItem/setItem/removeItem/key/length 全部读同一份 store，
  // 避免 preCheckStorageCapacity 里 localStorage.length 读到宿主真实存储而让结果随环境漂移。
  // __FAIL_KEYS：按键名注入 QuotaExceededError，用于验证 saveLogs 的「先写数据、后推索引」顺序。
  window.__FAIL_KEYS = null;
  localStorage.getItem = function(k) { return (k in store) ? store[k] : null; };
  localStorage.setItem = function(k, v) {
    if (window.__FAIL_KEYS && window.__FAIL_KEYS.some(function(p) { return String(k).indexOf(p) !== -1; })) {
      throw new DOMException('QuotaExceededError', 'QuotaExceededError');
    }
    store[k] = String(v);
  };
  localStorage.removeItem = function(k) { delete store[k]; };
  localStorage.key = function(i) { return Object.keys(store)[i] || null; };
  Object.defineProperty(localStorage, 'length', {
    configurable: true,
    get: function() { return Object.keys(store).length; }
  });
  localStorage.clear = function() { for (var k in store) delete store[k]; };
  window.logs = [];

  // settings.js 的 _commitImportedLogs 直接调用 renderSettings()（没有 typeof 守卫），
  // 测试页不加载 settings 渲染模块，这里补一个空实现，避免第 23 组的 CSV 导入用例抛错。
  window.renderSettings = function() { };

  var pass = 0, fail = 0;
  function T(name, cond) {
    if (cond) { pass++; return '<div class="t-pass">PASS ' + name + '</div>'; }
    fail++; return '<div class="t-fail">FAIL ' + name + '</div>';
  }
  function group(title) { return '<div style="margin-top:8px;font-weight:600;font-size:13px;">' + title + '</div>'; }
  function loadErr(name) {
    fail++;
    return '<div class="t-fail">加载失败 ' + name + '（依赖文件缺失或语法错误）</div>';
  }

  window.runAll = function() {
    pass = 0; fail = 0;
    var h = '';
    var util = window.utils;
    if (!util || typeof util.isClosedTrade !== 'function') h += loadErr('utils.js');
    if (typeof calcKelly !== 'function') h += loadErr('skills-integration.js');
    if (typeof Slippage === 'undefined') h += loadErr('slippage.js');
    if (typeof StorageSecurity === 'undefined') h += loadErr('storage.js');

    // ---- 1. 平仓判定 ----
    h += group('1. isClosedTrade / isPartialClosed 判定');
    h += T('持仓记录非已平仓', util.isClosedTrade({ closeType: '', pnlAmount: 1 }) === false);
    h += T('正常平仓=已平仓', util.isClosedTrade({ closeType: 'tp', pnlAmount: 12.5 }) === true);
    h += T('partialTP 50% 新格式=中间态', util.isClosedTrade({ closeType: 'partialTP', closes: [{}], closedRatio: 50, pnlAmount: 5 }) === false);
    h += T('reducePosition 100%=已平仓', util.isClosedTrade({ closeType: 'reducePosition', closes: [{}], closedRatio: 100, pnlAmount: 8 }) === true);
    h += T('isPartialClosed 100% 为假', util.isPartialClosed({ closeType: 'reducePosition', closes: [{}], closedRatio: 100 }) === false);

    // ---- 2. getClosedSorted 过滤 ----
    h += group('2. getClosedSorted 只含最终平仓');
    window.logs = [
      { id: 1, closeType: '', pnlAmount: null, time: '2026-09-01T08:00:00Z' },
      { id: 2, closeType: 'partialTP', closes: [{}], closedRatio: 50, pnlAmount: 3, time: '2026-09-02T08:00:00Z', closeTime: '2026-09-02T08:00:00Z' },
      { id: 3, closeType: 'tp', pnlAmount: 10, time: '2026-09-03T08:00:00Z', closeTime: '2026-09-03T08:00:00Z' }
    ];
    var sorted = util.getClosedSorted();
    h += T('数量=1（排除中间态）', sorted.length === 1 && sorted[0].id === 3);

    // ---- 3. 凯利公式 ----
    h += group('3. calcKelly 半凯利与截断');
    var k0 = calcKelly(0.51, 10, 9.8, 10000, true, 1); // kelly=(5.1-4.802)/10=0.0298 < 5% 不截断
    h += T('kellyPct=(WR*W-LR*L)/W=0.0298', k0 && Math.abs(k0.kellyPct - 0.0298) < 1e-9);
    h += T('halfKellyPct=0.0149', k0 && Math.abs(k0.halfKellyPct - 0.0149) < 1e-9);
    h += T('期望=WR*W-LR*L=0.298', k0 && Math.abs(k0.expectancy - 0.298) < 1e-9);
    // P1-5 修复：Kelly% 本身就是「单笔风险占本金比例」，不能再 ÷杠杆（那会把风险比例
    // 与名义敞口混为一谈，同一策略随杠杆把建议风险缩 20 倍）。上限固定 5%。
    var k1a = calcKelly(0.6, 20, 10, 10000, true, 1);  // 原始 0.4，半凯利 0.2
    var k1b = calcKelly(0.6, 20, 10, 10000, true, 10); // 同策略、杠杆 ×10
    var k1c = calcKelly(0.6, 20, 10, 10000, true, 20); // 同策略、杠杆 ×20
    h += T('杠杆截断：原始 0.4 截断到 0.05', k1a && Math.abs(k1a.kellyPct - 0.05) < 1e-9);
    h += T('半凯利 0.2 截断到 0.05', k1a && Math.abs(k1a.halfKellyPct - 0.05) < 1e-9);
    h += T('截断标记 kellyCapped=true', k1a && k1a.kellyCapped === true);
    // 关键回归：建议风险与杠杆无关（杠杆敞口由保证金/热量/单品种占比独立约束）
    h += T('lev=1 与 lev=10 建议风险一致', k1a && k1b && Math.abs(k1a.halfKellyPct - k1b.halfKellyPct) < 1e-9);
    h += T('lev=10 仍为 0.05（不再被折叠成 0.005）', k1b && Math.abs(k1b.halfKellyPct - 0.05) < 1e-9);
    h += T('lev=20 仍为 0.05（卡片与实际不再 2 倍错位）', k1c && Math.abs(k1c.halfKellyPct - 0.05) < 1e-9);
    var k2 = calcKelly(0.3, 10, 20, 10000, true, 10); // 期望为负
    h += T('期望为负时 kellyPct<=0', k2 && k2.kellyPct <= 0);

    // P0-1 修复：三结果凯利。保本单不再是「完整亏损」，亏损率 = 1 - 胜率 - 保本率。
    // 口径：3 胜 +100 / 3 亏 -90 / 4 保本 → 胜率 30%，保本率 40%，亏损率 30%
    // （选 avgLoss=90 使 kelly=0.03 < 5% 上限，避开截断，专测公式本身）
    var k3 = calcKelly(0.3, 100, 90, 10000, true, 1, 0.4);
    h += T('三结果：亏损率取 0.3 而非 0.7（期望=3）', k3 && Math.abs(k3.expectancy - 3) < 1e-9);
    h += T('三结果：kellyPct=0.03', k3 && Math.abs(k3.kellyPct - 0.03) < 1e-9);
    h += T('三结果：halfKellyPct=0.015', k3 && Math.abs(k3.halfKellyPct - 0.015) < 1e-9);
    // 不传保本率保持旧行为（默认 0），兼容其它调用方
    var k3old = calcKelly(0.3, 100, 90, 10000, true, 1);
    h += T('未传保本率：期望=30-63=-33（保本单被算作亏损）', k3old && Math.abs(k3old.expectancy - (-33)) < 1e-9);
    h += T('同一批数据两口径结论相反：旧判负期望 / 三结果为正', k3old && k3old.kellyPct <= 0 && k3 && k3.kellyPct > 0);
    // 与统计页口径对账：期望 = (总盈 - 总亏)/笔数，对保本中性
    h += T('与统计页一致：期望=(GP-GL)/N=3', k3 && Math.abs(k3.expectancy - (300 - 270) / 10) < 1e-9);

    // ---- 4. calcKellyStatsFromLogs 保本分母 ----
    h += group('4. 凯利统计：胜率分母含保本');
    // 时间窗口测试用动态日期（lookbackDays 以真实今天为基准，固定日期会随时间过期失效）
    var _d = function(daysAgo) { var t = new Date(); t.setDate(t.getDate() - daysAgo); return t.toISOString(); };
    window.logs = [
      { closeType: 'tp', pnlAmount: 10, closeTime: _d(3) },
      { closeType: 'sl', pnlAmount: -6, closeTime: _d(2) },
      { closeType: 'tp', pnlAmount: 0, closeTime: _d(1) }
    ];
    var ks = calcKellyStatsFromLogs(3);
    h += T('winRate=1/3（保本计入分母）', ks && Math.abs(ks.winRate - 1/3) < 1e-9);
    h += T('avgWin=10 / avgLoss=6', ks && Math.abs(ks.avgWin - 10) < 1e-9 && Math.abs(ks.avgLoss - 6) < 1e-9);
    h += T('samples=3', ks && ks.samples === 3);
    var ks30 = calcKellyStatsFromLogs(3, undefined, 30);
    h += T('lookbackDays 过滤后仍有效', ks30 != null);

    // ---- 5. 滑点模型 ----
    h += group('5. Slippage 反向滑点方向');
    var longModel = Slippage.calculate({ direction: 'long', expectedEntryPrice: 60000, expectedExitPrice: 61000, quantity: 0.1, tickSize: 0.1, entryTicks: 1, exitTicks: 1 });
    h += T('做多：有效入场价上移（不利）', longModel.effectiveEntryPrice > 60000);
    h += T('做多：有效出场价下移（不利）', longModel.effectiveExitPrice < 61000);
    var shortModel = Slippage.calculate({ direction: 'short', expectedEntryPrice: 3000, expectedExitPrice: 2900, quantity: 1, tickSize: 0.01, entryTicks: 2, exitTicks: 2 });
    h += T('做空：有效入场价下移（不利）', shortModel.effectiveEntryPrice < 3000);
    h += T('做空：有效出场价上移（不利）', shortModel.effectiveExitPrice > 2900);

    // ---- 6. 权益曲线 ----
    h += group('6. calcEquityCurve 峰值/回撤');
    var curve = util.calcEquityCurve([
      { pnlAmount: 100, closeTime: '2026-09-01T08:00:00Z', capital: 10000 },
      { pnlAmount: -50, closeTime: '2026-09-02T08:00:00Z', capital: 10000 }
    ]);
    h += T('权益曲线存在', curve && Array.isArray(curve.data) && curve.data.length >= 2);
    h += T('maxDDPercent >= 0', curve && curve.maxDDPercent >= 0);

    // ---- 7. 存储安全 ----
    h += group('7. StorageSecurity 容量判定');
    var cOk = StorageSecurity.checkCapacity(1000);
    h += T('小数据可写', cOk.canWrite === true);
    var cHuge = StorageSecurity.checkCapacity(1e9);
    h += T('超限数据被拒绝', cHuge.canWrite === false);

    // ---- 8. TICK_SIZE_MAP 品种覆盖 + 未映射品种的价格自适应兜底 ----
    h += group('8. tick size 映射');
    h += T('BTC=0.1', getTickSize('BTC') === 0.1);
    h += T('XRP=0.0001（新增）', getTickSize('XRP') === 0.0001);
    // P0 回归：原实现未知品种兜底 0.1，SHIB(0.05) 会算出负成交价并 throw，永久卡死 _calculating。
    // 现按价格量级估算，1 tick ≈ 价格的 1e-5。
    h += T('未知品种不再固定 0.1', getTickSize('ZZZ') !== 0.1);
    h += T('低价品种 tick 小于价格', getTickSize('SHIB', 0.05) < 0.05);
    h += T('中价品种 tick 合理(0.3)', getTickSize('WIF', 0.3) < 0.001 && getTickSize('WIF', 0.3) > 1e-7);
    h += T('未传价格时不产生 0/负值', getTickSize('ZZZ') > 0);
    // token 精确匹配（2026-09-23）：旧实现用 upper.includes(key) 子串匹配，
    // SOLANA 命中 SOL、ETHEREUM 命中 ETH、DOGE1000 命中 DOGE，拿错 tick 直接放大滑点估算。
    h += T('交易所后缀格式仍命中映射（BTCUSDT）', getTickSize('BTCUSDT') === 0.1);
    h += T('合约写法仍命中映射（XRP-USDC-PERP）', getTickSize('XRP-USDC-PERP') === 0.0001);
    h += T('斜杠写法仍命中映射（ETH/USDC）', getTickSize('ETH/USDC') === 0.01);
    h += T('SOLANA 不再误判为 SOL', getTickSize('SOLANA', 150) === getTickSize('__UNMAPPED__', 150));
    h += T('ETHEREUM 不再误判为 ETH', getTickSize('ETHEREUM', 3000) !== 0.01);
    h += T('SHIB 滑点不再产生负成交价',
      Slippage.applyAdversePrice(0.05, 'short', 2, getTickSize('SHIB', 0.05), 'entry').filledPrice > 0);

    // ---- 9. 保存门与组合视图存在性 ----
    h += group('9. assertSavableCalculation / renderPortfolioRisk');
    h += T('calculator.js 可独立加载（无 CalculationUI 不崩）', typeof assertSavableCalculation === 'function');
    h += T('空态保存门安全返回', typeof assertSavableCalculation === 'function' && assertSavableCalculation().ok === false);
    h += T('renderPortfolioRisk 已定义', typeof renderPortfolioRisk === 'function');

    // ---- 10. 在仓口径统一（2026-09-23 开仓逻辑审计 P1）----
    // risk.js 曾以裸标识符 util.isClosedTrade 判定，而全局只有 window.utils（复数）——
    // typeof util 恒为 undefined，getOpenPositions() 的权威分支在生产从未执行，
    // partialTP/reducePosition 剩余仓位被排除在保证金占用 / 集中度 / 组合热量 / 强平监控之外。
    h += group('10. 在仓口径统一 getOpenPositions / isTradeStillOpen');
    h += T('统一入口 isTradeStillOpen 已定义', typeof isTradeStillOpen === 'function');
    window.logs = [
      { closeType: '', pnlAmount: null, positionSize: 1000, leverage: 10 },
      { closeType: 'partialTP', closes: [{ratio:50}], closedRatio: 50, pnlAmount: 5, positionSize: 100, leverage: 10 },
      { closeType: 'partialTP', closes: [{ratio:100}], closedRatio: 100, pnlAmount: 5, positionSize: 0, leverage: 10 },
      { closeType: 'takeProfit', pnlAmount: -50, positionSize: 500, leverage: 10 }
    ];
    var _openPos = getOpenPositions();
    h += T('partialTP 50% 剩余仓位计入在仓（修复前被排除）', _openPos.length === 2);
    h += T('在仓集合内不存在已平仓记录', _openPos.every(function(p) { return isTradeStillOpen(p); }));
    h += T('calculator.js 在仓过滤与 risk.js 同口径',
      window.logs.filter(isTradeStillOpen).length === _openPos.length);

    h += group('11. 盈亏比反推 / 多止盈 含费净 RR 口径');
    // 口径定义（planner.js 顶部注释）：
    //   rr = ((tpDist/ep) − f×(1 + tp/ep)) / ((sd/ep) + f×(1 + sl/ep))
    // 修复前生成端按纯毛利 stopDistance×rr 求解，回填后实际净 RR 恒低于请求值
    // （实测 85%~90% 达成率），且「按 2 倍止损距离放的 TP」会被 2R 门判不达标。
    var _stubCalc = {
      entryPrice: 50000, effectiveEntryPrice: 50000, stopLoss: 49000,
      direction: 'long', stopDistance: 1000, positionSize: 3000,
      riskAmount: 60, fee: 4.75, feeRate: 0.08, capital: 10000
    };
    setCalc(_stubCalc);
    var _f = 0.08 / 100;
    function _netRR(ep, sd, sl, tp, dir) {
      var tpDist = dir === 'long' ? (tp - ep) : (ep - tp);
      return ((tpDist / ep) - _f * (1 + tp / ep)) / ((sd / ep) + _f * (1 + sl / ep));
    }
    h += T('getTPUnits 返回含费口径', typeof getTPUnits === 'function' && !!getTPUnits());
    var _u = getTPUnits();
    h += T('getTPUnits.ep 取 effectiveEntryPrice', _u.ep === 50000);
    h += T('getTPUnits.unitStop = 止损距离/入场', Math.abs(_u.unitStop - 0.02) < 1e-9);
    h += T('getTPUnits.unitLoss 含止损腿往返费', _u.unitLoss > 0.02);

    var _okTP = true;
    [1, 1.5, 2, 3, 5].forEach(function(rr) {
      var tp = solveTPForRR(_u, rr, 'long');
      if (!tp || Math.abs(_netRR(50000, 1000, 49000, tp, 'long') - rr) > 1e-6) _okTP = false;
    });
    h += T('solveTPForRR 解出的 TP 净 RR 精确等于请求值', _okTP);
    h += T('solveTPForRR 结果高于纯毛利距离（费用需额外价格空间）',
      solveTPForRR(_u, 2, 'long') > 50000 + 1000 * 2);
    h += T('solveTPForRR 单调：RR 越大止盈价越远',
      solveTPForRR(_u, 1, 'long') < solveTPForRR(_u, 2, 'long') &&
      solveTPForRR(_u, 2, 'long') < solveTPForRR(_u, 3, 'long'));

    var _sl = solveSLForRR(_u, 2, 52000, 'long');
    h += T('solveSLForRR 解出的止损使净 RR = 请求值', _sl != null &&
      Math.abs(_netRR(50000, 50000 - _sl, _sl, 52000, 'long') - 2) < 1e-6);
    // 与止盈方向相反：含费口径下止损更【紧】而非更宽。
    // 费用同时压缩分子（净毛利）、膨胀分母（净止损），故需收紧止损才能守住净 RR。
    // 纯毛利反推 sd=1000，含费反推 sd≈880。
    h += T('solveSLForRR 止损距离小于纯毛利反推（费用压缩分子+膨胀分母）',
      _sl != null && (50000 - _sl) < 1000 && (50000 - _sl) > 0);
    h += T('solveSLForRR 目标价过近时返回 null（覆盖不了费用）',
      solveSLForRR(_u, 2, 50010, 'long') === null);

    setCalc({ entryPrice: 50000, effectiveEntryPrice: 50000, stopLoss: 51000,
              direction: 'short', stopDistance: 1000, feeRate: 0.08 });
    var _us = getTPUnits();
    var _tps = solveTPForRR(_us, 2, 'short');
    h += T('solveTPForRR 做空对称（目标价在入场下方且净 RR 精确）',
      _tps < 50000 && Math.abs(_netRR(50000, 1000, 51000, _tps, 'short') - 2) < 1e-6);

    // 加权 RR 不得随无关的 calc.fee（目标腿/止损腿）漂移——fee drift 修复回归
    var _stub = document.createElement('div');
    ['tp1', 'tp2', 'tp3'].forEach(function(p) {
      var pe = document.createElement('input'); pe.id = p + 'Price';
      var re = document.createElement('input'); re.id = p + 'Ratio';
      _stub.appendChild(pe); _stub.appendChild(re);
    });
    document.body.appendChild(_stub);
    _stub.querySelector('#tp1Price').value = '52000'; _stub.querySelector('#tp1Ratio').value = '100';
    _stub.querySelector('#tp2Price').value = '';   _stub.querySelector('#tp2Ratio').value = '0';
    _stub.querySelector('#tp3Price').value = '';   _stub.querySelector('#tp3Ratio').value = '0';
    setCalc(Object.assign({}, _stubCalc, { fee: 4.75, targetPrice: null }));
    var _w1 = computeWeightedTPRR();
    setCalc(Object.assign({}, _stubCalc, { fee: 9.99, targetPrice: 60000 }));
    var _w2 = computeWeightedTPRR();
    h += T('加权 RR 不随 calc.fee（目标腿/止损腿）漂移',
      _w1 && _w2 && Math.abs(_w1.rr - _w2.rr) < 1e-12);

        logs = [one];
        openEditModal(0);
        document.getElementById('emPartialRatio').value = '50';
        h += T('单次部分平仓原样保存仍幂等',
          saveEditLog(0) === true && logs[0].closedRatio === 50 && logs[0].positionSize === 500 &&
          logs[0].riskAmount === 7500 && logs[0].actualMargin === 5000);

        // 无事件簿记的旧数据：closes 为空但 closedRatio>0，历史已平比例不能丢
        var orphan = makeRec('lg_p2_c');
        orphan.closes = []; orphan.closedRatio = 50; orphan.positionSize = 500; orphan.riskAmount = 7500;
        orphan.initialPositionSize = 1000;
        logs = [orphan];
        openEditModal(0);
        document.querySelector('input[name="emPartialRatioBase"][value="initial"]').checked = true;
        emSwitchRatioBase();
        document.getElementById('emPartialRatio').value = '20';
        h += T('旧数据（无事件簿记）可编辑', saveEditLog(0) === true);
        h += T('旧数据：历史 50% 未被丢掉，累计 = 70', logs[0].closedRatio === 70);
        h += T('旧数据：历史部分补回成一条事件',
          logs[0].closes.length === 2 && logs[0].closes[0].ratio === 50 && logs[0].closes[1].ratio === 20);
        h += T('旧数据：剩余仓位 = 1000×30% = 300', logs[0].positionSize === 300);
      } finally {
        logs = _oldLogs;
      }
    })();

    // ---- 26. CSV / JSON 导入共用一条流水线（P2）----
    h += group('26. 导入流水线合并：校验 fail-closed 与去重口径');
    h += T('_prepareImportedRecords 已定义', typeof _prepareImportedRecords === 'function');
    h += T('_confirmImportThenCommit 已定义', typeof _confirmImportThenCommit === 'function');
    h += T('旧的 _confirmOverwriteThenCommit 已删除', typeof _confirmOverwriteThenCommit === 'undefined');
    (function () {
      var _oldLogs = logs;
      var dupRec = { time: '2026-10-04T05:00:00.000Z', symbol: 'BTC', direction: 'long',
        entryPrice: 60000, stopLoss: 58000, positionSize: 2.5, leverage: 10 };
      var clone = function () { return JSON.parse(JSON.stringify(dupRec)); };
      try {
        logs = [];
        var rep = _prepareImportedRecords([clone(), clone()]);
        h += T('无校验错误', rep.errors.length === 0);
        h += T('同文件内两条重复记录只留 1 条', rep.candidates.length === 1);
        h += T('重复计数为 1', rep.deduped === 1);
        h += T('自动补 id 且格式正确', /^lg_\d{8}T\d{6}_[a-z0-9]{6}$/.test(rep.candidates[0].id));

        // 同一份没有 ID 列的导出重复导入：必须靠去 id 指纹认出来
        logs = [rep.candidates[0]];
        var rep2 = _prepareImportedRecords([clone()]);
        h += T('已有同内容记录时判为重复', rep2.candidates.length === 0 && rep2.deduped === 1);
        h += T('已有日志计数正确', rep2.existingCount === 1);

        // 带 id 且 id 不同、内容也不同的两条仍视为两条记录
        logs = [rep.candidates[0]];
        var other = clone();
        other.id = 'lg_other_001'; other.entryPrice = 61000;
        var rep3 = _prepareImportedRecords([other]);
        h += T('内容不同不会被误合并', rep3.candidates.length === 1);

        // 校验失败整批拒绝（fail-closed），不留下半截数据
        logs = [];
        var bad = _prepareImportedRecords([
          { time: '2026-10-04T06:00:00.000Z', symbol: 'ETH', direction: 'long', entryPrice: 3500 },
          { time: '2026-10-04T07:00:00.000Z', symbol: 'SOL', direction: 'bad', entryPrice: -5 }
        ]);
        h += T('存在坏记录时整体拒绝', bad.errors.length > 0 && bad.candidates.length === 0);

        // 解析阶段告警要透传到确认文案，不能被吞掉
        logs = [];
        var wrep = _prepareImportedRecords([
          { time: '2026-10-04T08:00:00.000Z', symbol: 'BTC', direction: 'long', entryPrice: 60000, stopLoss: 58000 }
        ], '3 行列数与表头不一致，已跳过');
        h += T('解析告警被透传', wrep.warnings.some(function (w) { return w.indexOf('列数') >= 0; }));

        // 字符串数值必须先归一化再校验，不能被误判成字段类型错误
        logs = [];
        var srep = _prepareImportedRecords([
          { time: '2026-10-04T09:00:00.000Z', symbol: 'ETH', direction: 'long',
            entryPrice: '3500', stopLoss: '3600', positionSize: '1', leverage: '10' }
        ]);
        h += T('字符串数值先归一化（不误报类型错误）',
          srep.errors.length === 0 && srep.candidates.length === 1 && srep.candidates[0].entryPrice === 3500);
      } finally {
        logs = _oldLogs;
      }
    })();

    // ---- 26b. 0 条候选不得进入提交路径（P1，重复导入自己导出的 CSV 会清空全部历史）----
    // 修复前：去重把整批丢弃（candidates=0）后覆盖模式仍弹「用文件中的 0 条记录覆盖现有 N
    // 条日志」，用户确认即 _commitImportedLogs([]) 清空全部历史，还回「已导入 0 条日志」的
    // success 提示。追加模式提交空数组虽无害，但会给「成功导入 0 条」的误导提示，一并拦下。
    h += T('_showImportEmptyResult 已定义', typeof _showImportEmptyResult === 'function');
    (function () {
      var _oldLogs = logs;
      var _oldConfirm = window.confirmDialog;
      var _oldToast = window.showToast;
      var seen = [], toasts = [];
      try {
        window.showToast = function (m, t) { toasts.push([m, t || '']); };
        window.confirmDialog = function (a) {
          seen.push({ title: a && a.title, message: a && a.message, alertOnly: !!a.alertOnly });
          return Promise.resolve(false);
        };
        var dupRec = { time: '2026-10-04T10:00:00.000Z', symbol: 'BTC', direction: 'long',
          entryPrice: 60000, stopLoss: 58000, positionSize: 2.5, leverage: 10 };

        // 场景 1：重复导入自己导出的那份文件——去重把整批丢完，覆盖模式不得清空历史
        logs = [JSON.parse(JSON.stringify(dupRec))];
        var zero = _prepareImportedRecords([JSON.parse(JSON.stringify(dupRec))]);
        h += T('重复导入被去重成 0 条候选', zero.candidates.length === 0 && zero.existingCount === 1);
        seen = []; toasts = [];
        _confirmImportThenCommit(zero, 'overwrite');
        h += T('0 条候选覆盖模式改为提示框而非覆盖确认', seen.length === 1 && seen[0].title === '没有可导入的记录');
        h += T('0 条候选覆盖模式提示框为纯告知', seen[0] && seen[0].alertOnly === true);
        h += T('0 条候选覆盖模式不提交、不弹成功提示', logs.length === 1 && toasts.length === 0);

        // 场景 2：追加模式同样拦下，不再给「成功导入 0 条」
        seen = []; toasts = [];
        _confirmImportThenCommit(zero, 'append');
        h += T('0 条候选追加模式同样走提示框', seen.length === 1 && seen[0].title === '没有可导入的记录');
        h += T('0 条候选追加模式不写入日志', logs.length === 1 && toasts.length === 0);

        // 场景 3：现有日志为空时也不能静默「导入 0 条成功」
        logs = [];
        var empty = _prepareImportedRecords([]);
        h += T('空文件解析为 0 条候选', empty.candidates.length === 0 && empty.existingCount === 0);
        seen = []; toasts = [];
        _confirmImportThenCommit(empty, 'overwrite');
        h += T('空文件覆盖模式给出提示而非静默提交', seen.length === 1 && seen[0].title === '没有可导入的记录');
        h += T('空文件不产生成功提示', toasts.length === 0);

        // 场景 4：护栏不能把正常路径一起关掉
        logs = [JSON.parse(JSON.stringify(dupRec))];
        var ok = _prepareImportedRecords([
          { time: '2026-10-04T11:00:00.000Z', symbol: 'ETH', direction: 'long',
            entryPrice: 3500, stopLoss: 3600, positionSize: 1, leverage: 10 }
        ]);
        h += T('有 1 条有效记录时 candidates 为 1', ok.candidates.length === 1);
        seen = []; toasts = [];
        _confirmImportThenCommit(ok, 'overwrite');
        h += T('正常覆盖仍弹覆盖确认框', seen.length === 1 && seen[0].title === '导入将覆盖现有日志' && seen[0].alertOnly === false);
        seen = []; toasts = [];
        _confirmImportThenCommit(ok, 'append');
        h += T('正常追加仍弹追加确认框', seen.length === 1 && seen[0].title === '确认导入');

        // 场景 5：解析阶段告警要跟着提示框一起显示，不能被丢弃
        seen = [];
        logs = [JSON.parse(JSON.stringify(dupRec))];
        var warned = _prepareImportedRecords([JSON.parse(JSON.stringify(dupRec))], '3 行列数与表头不一致，已跳过');
        _confirmImportThenCommit(warned, 'overwrite');
        h += T('0 条候选提示框带上解析告警', seen.length === 1 && seen[0].message.indexOf('列数') >= 0);
      } finally {
        logs = _oldLogs;
        window.confirmDialog = _oldConfirm;
        window.showToast = _oldToast;
      }
    })();

    h += group('27. 反推路径 calc 缺失时仍走含费口径（P0）');
    // ---- 27. 反推路径：calc 缺失时仍走含费口径，不再静默退化成纯毛利（P0）----
    // 修复前 getTPUnits() 只在 _lastCalc 可用时返回口径，calcReverseTP / calcReverseSL /
    // autoCalcMultiTP 三条路径各自 fallback 到「stopDistance × rr」纯毛利解——请求 2R 实际
    // 只达成 1.78R（88.9%）。updateMultiTP 在 calc 为 null 时 f 恒为 0，各行显示同样是纯毛利。
    (function () {
      var _savedCalc = getCalc();
      var _savedDirty = getCalcDirty();
      var _savedToast = window.showToast;
      function mk(id, val, tag) {
        // 同 id 已存在时先移除：getElementById 只返回文档序第一个，重复创建会让
        // 被测函数一直读到旧元素（修过一次：反推输入框写成 '0' 却报 sd=1000）。
        var old = document.getElementById(id);
        if (old && old.parentNode) old.parentNode.removeChild(old);
        var el = document.createElement(tag || 'input');
        el.id = id; el._userEdited = false;
        // input 走 .value；span/div 等展示型元素只有 textContent（span.value 只是挂个属性）
        if (tag && tag !== 'input') el.textContent = val; else el.value = val;
        document.body.appendChild(el); return el;
      }
      function del(id) {
        var el = document.getElementById(id);
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      var ALL_IDS = ['entryPrice', 'stopLoss', 'direction', 'desiredRR', 'feeRate', 'reverseTP', 'reverseSL',
                     'orderType', 'tp1Price', 'tp2Price', 'tp3Price', 'tp1Ratio', 'tp2Ratio', 'tp3Ratio',
                     'tp1RR', 'tp2RR', 'tp3RR', 'tpRemain', 'tpWeightedRR'];
      function clearAll() { ALL_IDS.forEach(del); }
      // BTC 多单：入场 50000 / 止损 49000 / 费率 0.08%
      var EP = 50000, SL = 49000;
      function _u2(calc, formSL) {   // 复算 getTPUnits 的期望口径，供各形态共享断言
        var ep = 50000;
        var sl = (formSL != null && formSL !== '') ? parseFloat(formSL) : (calc && calc.stopLoss ? calc.stopLoss : SL);
        var feePct = (calc && calc.feeRate != null && calc.feeRate !== '') ? parseFloat(calc.feeRate) : 0.08;
        if (!(feePct > 0)) feePct = 0.08;
        var ff = feePct / 100;
        var sd = (calc && calc.stopDistance != null && calc.stopDistance !== '')
          ? parseFloat(calc.stopDistance) : Math.abs(sl - ep);
        return { ep: ep, sd: sd, sl: sl, ff: ff, loss: sd / ep + ff * (1 + sl / ep) };
      }

      // 4 种参数残缺形态都必须走同一条含费路径（form 全填 / calc 缺失费率 / calc+form 混用 / 无费率）
      var cases = [
        { name: '表单全填', calc: null, entry: EP, sl: SL, fee: '0.08' },
        { name: '未填费率（回落 0.08%）', calc: null, entry: EP, sl: SL, fee: '' },
        { name: '表单未填止损价（退回 calc 口径）', calc: { entryPrice: 50000, effectiveEntryPrice: 50000,
            stopLoss: 49000, direction: 'long', stopDistance: 1000, feeRate: 0.08 },
            entry: 99999, sl: '', fee: '' },
        { name: '无任何费率（按 0 计费）', calc: null, entry: EP, sl: SL, fee: '' }
      ];
      cases.forEach(function (c) {
        try {
          clearAll();
          setCalc(c.calc); setCalcDirty(false);
          mk('entryPrice', c.entry);
          mk('stopLoss', c.sl);
          mk('direction', 'long');
          mk('desiredRR', '2');
          mk('feeRate', c.fee);
          mk('reverseTP', '0'); mk('reverseSL', '0');

          var u = getTPUnits();
          var exp = _u2(c.calc, c.sl);
          h += T('[' + c.name + '] getTPUnits 口径正确（ep/sd/方向/费率）',
            !!u && u.ep === exp.ep && Math.abs(u.sd - exp.sd) < 1e-9 &&
            u.direction === 'long' && Math.abs(u.feeRateFrac - exp.ff) < 1e-12 &&
            Math.abs(u.unitLoss - exp.loss) < 1e-12);

          calcReverseTP();
          var tpNum = parseFloat(document.getElementById('reverseTP').value);
          // d = ep×(rr×unitLoss + 2f)/(1−f) 是【距离】，价格还要加回入场价
          var ek = exp.ep + exp.ep * (2 * exp.loss + 2 * exp.ff) / (1 - exp.ff);
          h += T('[' + c.name + '] 反推目标价取含费解 ' + ek.toFixed(2),
            !isNaN(tpNum) && Math.abs(tpNum - ek) < 1e-4);
          // 反推值经 toFixed(5) 落回输入框，价格量化会让净 RR 带 ~1e-8 残差，故容差取 1e-6
          h += T('[' + c.name + '] 回填值净 RR 精确等于 2',
            Math.abs((((tpNum - exp.ep) / exp.ep) - exp.ff * (1 + tpNum / exp.ep)) / exp.loss - 2) < 1e-6);

          if (c.fee !== '') {
            // 目标价 52000（几何上的纯毛利 2R）反推止损：含费口径下止损更【紧】
            mk('reverseTP', '52000');
            calcReverseSL();
            var slNum = parseFloat(document.getElementById('reverseSL').value);
            var actualSD = exp.ep - slNum;
            h += T('[' + c.name + '] 反推止损使净 RR 精确等于 2',
              !isNaN(slNum) && Math.abs((((52000 - exp.ep) / exp.ep) - exp.ff * (1 + 52000 / exp.ep)) /
                ((actualSD / exp.ep) + exp.ff * (1 + slNum / exp.ep)) - 2) < 1e-6);
            h += T('[' + c.name + '] 含费止损更紧（sd=' + actualSD.toFixed(1) + ' < 纯毛利 ' +
              (52000 - exp.ep) / 2 + '）', !isNaN(actualSD) && actualSD < (52000 - exp.ep) / 2 && actualSD > 0);

            // 三档多止盈同样必须按含费口径求解，且各行显示与求解同源
            mk('tp1Price', ''); mk('tp2Price', ''); mk('tp3Price', '');
            mk('tp1Ratio', '50'); mk('tp2Ratio', '30'); mk('tp3Ratio', '20');
            mk('tpRemain', '0'); mk('tpWeightedRR', '', 'span');
            mk('tp1RR', '', 'span'); mk('tp2RR', '', 'span'); mk('tp3RR', '', 'span');
            var rrs = [1.5, 2.0, 3.0];
            autoCalcMultiTP();
            var okRREnd = true, okNotGross = true;
            for (var k = 0; k < 3; k++) {
              var pk = parseFloat(document.getElementById('tp' + (k + 1) + 'Price').value);
              var ek2 = exp.ep + exp.ep * (rrs[k] * exp.loss + 2 * exp.ff) / (1 - exp.ff);
              if (!isFinite(pk) || Math.abs(pk - ek2) > 1e-4) okRREnd = false;
              if (Math.abs(pk - (exp.ep + exp.sd * rrs[k])) < 0.5) okNotGross = false;
              if (document.getElementById('tp' + (k + 1) + 'RR').textContent !== rrs[k].toFixed(2) + 'R') okRREnd = false;
              var rrExact = (((pk - exp.ep) / exp.ep) - exp.ff * (1 + pk / exp.ep)) / exp.loss;
              if (Math.abs(rrExact - rrs[k]) > 1e-6) okRREnd = false;
            }
            h += T('[' + c.name + '] autoCalcMultiTP 三档按含费解出且各行 RR 显示达标', okRREnd);
            h += T('[' + c.name + '] 三档均不再是纯毛利距离（tpRR×止损距离）', okNotGross);
          }
        } finally {
          clearAll();
        }
      });

      // 口径确实拿不到时必须明说，不能写一个会被 RR 门判不达标的答案
      (function () {
        var toasts = [];
        window.showToast = function (msg) { toasts.push(String(msg)); };
        try {
          clearAll();
          setCalc(null); setCalcDirty(false);
          mk('entryPrice', '0');          // 未填
          mk('stopLoss', SL);
          mk('direction', 'long'); mk('desiredRR', '2'); mk('feeRate', '0.08');
          mk('reverseTP', '52000'); mk('reverseSL', '0');

          calcReverseTP();
          h += T('缺少入场价时反推目标价给出提示而非数字',
            document.getElementById('reverseTP').value === '请先填写入场价和止损价');
          calcReverseSL();
          h += T('缺少入场价时反推止损给出提示而非数字',
            document.getElementById('reverseSL').value === '请先填写入场价');

          mk('entryPrice', EP); mk('stopLoss', EP);  // 止损=入场 → 无有效止损距离
          calcReverseTP();
          h += T('止损与入场同价时提示方向校验错误',
            document.getElementById('reverseTP').value === '做多止损价需 < 入场价');
          setCalcDirty(true);
          calcReverseTP();
          h += T('参数已变更时仍先拦脏状态（不覆盖已写入的提示）',
            document.getElementById('reverseTP').value === '做多止损价需 < 入场价');
          setCalcDirty(false);

          // 口径不可用时 autoCalcMultiTP 不写价格，改为提示
          del('tp1Price'); del('tp2Price'); del('tp3Price'); del('tpRemain'); del('tpWeightedRR');
          del('tp1RR'); del('tp2RR'); del('tp3RR');
          mk('entryPrice', ''); mk('stopLoss', ''); mk('desiredRR', '2');
          mk('tp1Price', ''); mk('tp2Price', ''); mk('tp3Price', '');
          mk('tp1Ratio', '0'); mk('tp2Ratio', '0'); mk('tp3Ratio', '0');
          mk('tpRemain', '0');
          mk('tp1RR', 'x', 'span'); mk('tp2RR', 'y', 'span'); mk('tp3RR', 'z', 'span');
          toasts.length = 0;   // 前面拦脏状态那次调用也会 toast，不混在一起判断
          autoCalcMultiTP();
          h += T('口径不可用时三档不写入价格',
            document.getElementById('tp1Price').value === '' &&
            document.getElementById('tp2Price').value === '' &&
            document.getElementById('tp3Price').value === '');
          h += T('口径不可用时未触碰各行 RR 占位（未调用 updateMultiTP）',
            document.getElementById('tp1RR').textContent === 'x' &&
            document.getElementById('tp2RR').textContent === 'y' &&
            document.getElementById('tp3RR').textContent === 'z');
          h += T('口径不可用时给出明确提示', toasts.length > 0 && toasts[0].indexOf('无法计算止盈位') >= 0);
        } finally {
          clearAll();
          window.showToast = _savedToast;
        }
      })();

      setCalc(_savedCalc); setCalcDirty(_savedDirty);
    })();

    document.getElementById('out').innerHTML = h;
    var sum = document.getElementById('summary');
    sum.innerHTML = '<span class="' + (fail === 0 ? 'pass' : 'fail') + '">PASS=' + pass + ' FAIL=' + fail + '</span>';
  };
  runAll();
})();
</script>
</body>
